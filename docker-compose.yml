services:
  nacos:
    image: nacos/nacos-server:v2.5.2
    container_name: nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: true
      NACOS_AUTH_TOKEN: U8Gv2X4e7Kz2tNvPHhj/KFZxrtKUCS89feR5E3tgZ6o=
      NACOS_AUTH_IDENTITY_KEY: srv-nacos-cse-config-bridge-local
      NACOS_AUTH_IDENTITY_VALUE: srv-nacos-cse-config-bridge-local
    ports:
      # Nacos HTTP API/UI。这里只是单机版 Nacos 服务端本身；
      # 应用服务应使用 srv-nacos-cse-config-bridge:8080。
      - "8848:8848"
      # Nacos 2.x Config 客户端 gRPC（8848 + 1000）。对比测试
      # 直接从源 Nacos 服务端读取时需要它。
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs

  cse:
    image: ghcr.io/renfei/cse:2.1.5
    container_name: cse
    restart: unless-stopped
    ports:
      # Service Center、CSE 控制台和 KIE 配置中心。
      - "30100:30100"
      - "30103:30103"
      - "30110:30110"
    volumes:
      - cse-data:/var/lib/cse

  srv-nacos-cse-config-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srv-nacos-cse-config-bridge
    restart: unless-stopped
    depends_on:
      - cse
    # 网桥的资源有意设了上限；没有 cgroup 限制时，JVM 会按宿主机
    # 推导数 GB 的最大堆，而不是按服务的实际需求。
    # 大规模部署时用 BRIDGE_MEMORY_LIMIT 覆盖。
    mem_limit: ${BRIDGE_MEMORY_LIMIT:-384m}
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--XX:+UseCompactObjectHeaders -Xms32m -Xmx256m -XX:AOTMode=auto -XX:AOTCache=/app/app.aot}"
      # 桥接自身的 Nacos 鉴权。默认关闭以兼容现有客户端；
      # 开启后 accept-any=true 接受任意非空用户名密码，
      # false 则只接受下面配置的用户名和密码。
      NACOS_AUTH_ENABLED: ${NACOS_AUTH_ENABLED:-false}
      NACOS_AUTH_ACCEPT_ANY_CREDENTIALS: ${NACOS_AUTH_ACCEPT_ANY_CREDENTIALS:-false}
      NACOS_AUTH_USERNAME: ${NACOS_AUTH_USERNAME:-nacos}
      NACOS_AUTH_PASSWORD: ${NACOS_AUTH_PASSWORD:-}
      NACOS_AUTH_TOKEN_TTL_SECONDS: ${NACOS_AUTH_TOKEN_TTL_SECONDS:-18000}
      # 无状态令牌的共享签名密钥；多副本必须使用完全相同的值。
      NACOS_AUTH_TOKEN_SECRET: ${NACOS_AUTH_TOKEN_SECRET:-}
      # KIE API 由 CSE 容器在其内部网络上暴露。
      CSE_CONFIG_SERVER_ADDR: http://cse:30110
      CSE_PROJECT: ${CSE_PROJECT:-default}
      CSE_CONFIG_APP: ${CSE_CONFIG_APP:-nacos-config-bridge}
      # 打包的 Compose 环境自带本地服务中心，所以面板
      # 注册默认启用。设为 false 可禁用。
      CSE_SERVICE_CENTER_ENABLED: ${CSE_SERVICE_CENTER_ENABLED:-true}
      CSE_SERVICE_CENTER_ADDR: http://cse:30100
      CSE_SERVICE_CENTER_PROJECT: ${CSE_SERVICE_CENTER_PROJECT:-default}
      CSE_SERVICE_CENTER_TENANT_NAME: ${CSE_SERVICE_CENTER_TENANT_NAME:-default}
      CSE_SERVICE_CENTER_APP_ID: ${CSE_SERVICE_CENTER_APP_ID:-default}
      CSE_SERVICE_CENTER_ENVIRONMENT: ${CSE_SERVICE_CENTER_ENVIRONMENT:-development}
      CSE_POLLING_WAIT_SECONDS: ${CSE_POLLING_WAIT_SECONDS:-29}
      CSE_SOCKET_TIMEOUT_SECONDS: ${CSE_SOCKET_TIMEOUT_SECONDS:-40}
      # Compose 为这个本地环境启用了一次性 Nacos -> KIE 迁移端点；
      # 设 NACOS_MIGRATION_ENABLED=false 可禁用。
      NACOS_MIGRATION_ENABLED: ${NACOS_MIGRATION_ENABLED:-true}
      CSE_SSL_ENABLED: ${CSE_SSL_ENABLED:-false}
    ports:
      # 本代理暴露的 Nacos 兼容 Config HTTP API。
      - "8080:8080"
      # Nacos 2.x Config 客户端 gRPC（8080 + 1000）。
      - "9080:9080"

volumes:
  nacos-data:
  nacos-logs:
  cse-data:
